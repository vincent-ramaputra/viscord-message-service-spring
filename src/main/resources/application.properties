spring.application.name=message-service
spring.http.multipart.enabled=true
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
grpc.client.guild-service.address=${GUILD_SERVICE_GRPC_ADDR}
grpc.client.guild-service.negotiation-type=plaintext
grpc.server.port=9090
# RabbitMQ, same env vars as the NestJS services. No credentials, so Spring uses guest/guest like their amqp://host:port URLs.
spring.rabbitmq.host=${RMQ_HOST}
spring.rabbitmq.port=${RMQ_PORT:5672}
# Deadline applied to every outbound gRPC call that doesn't set its own (see GrpcClientConfig).
viscord.grpc.client-deadline=2s
spring.cloud.aws.s3.bucket=${BUCKET_NAME}
spring.cloud.aws.region.static=${S3_REGION}
viscord.storage.upload-url-ttl=5m
viscord.storage.public-endpoint=${S3_PUBLIC_ENDPOINT:}
viscord.storage.max-file-size=25MB
viscord.storage.allowed-content-types=*/*
# Optional: when blank, the AWS default credentials chain is used (EKS Pod Identity / IRSA in prod).
spring.cloud.aws.credentials.access-key=${S3_ACCESS_KEY_ID:}
spring.cloud.aws.credentials.secret-key=${S3_ACCESS_KEY_SECRET:}
# Optional: set only for non-AWS S3-compatible storage (MinIO, etc.).
spring.cloud.aws.s3.endpoint=${S3_ENDPOINT:}
spring.cloud.aws.s3.path-style-access-enabled=true